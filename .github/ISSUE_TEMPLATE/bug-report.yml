name: Bug report
description: Report one reproducible Codex Web GPT failure with fresh privacy-safe diagnostics.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please read [Troubleshooting](https://github.com/JiaJunDeng5930/ChatGPT2Local/blob/main/TROUBLESHOOTING.md), run `doctor`, and reproduce the failure once before filing.
        Never upload cookies, browser storage, API keys, Tunnel IDs, `application.sqlite`, the desktop profile, turn capabilities, or unredacted Codex prompts/tool output.

  - type: input
    id: application-version
    attributes:
      label: Codex Web GPT version
      description: Use `codex-chatgpt-web --version` or the version of the packaged desktop, not "latest".
      placeholder: x.y.z
    validations:
      required: true

  - type: input
    id: codex-version
    attributes:
      label: Codex version
      description: Include Codex Desktop and/or `codex --version`, whichever reproduces the failure.
      placeholder: Codex Desktop … / codex-cli …
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS arm64
        - macOS x64
        - Windows x64
        - Linux x64
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: macOS 15.7 / Windows 11 24H2 / Ubuntu 24.04
    validations:
      required: true

  - type: dropdown
    id: account-tier
    attributes:
      label: ChatGPT account tier
      options:
        - Free
        - Go
        - Plus
        - Pro
        - Business / Enterprise / Edu
        - Unknown
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Integration mode
      options:
        - Browser-only
        - Full harness (MCP)
        - Setup / sign-in (no model turn yet)
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Selected model
      description: Use the exact Codex model-picker name. Write "not applicable" for setup failures.
      placeholder: ChatGPT Web — High
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed result and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Number the smallest reliable sequence starting from a fresh Codex task or application state.
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: textarea
    id: exact-error
    attributes:
      label: Complete final error
      description: Include the detailed error from the single failed attempt. Do not create extra sends just to gather diagnostics.
      render: text
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Privacy-safe diagnostics
      description: Include sanitized `doctor` output and the relevant operation phase/fault code from `status`. Remove private paths and identifiers.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Preflight checklist
      options:
        - label: I tested the current release and ran `doctor` before reproducing the failure once.
          required: true
        - label: I stated whether the failure also occurs in a fresh Codex task, or explained why that does not apply.
          required: true
        - label: I included only sanitized diagnostics and did not attach the application database, browser profile, credentials, capabilities, prompts, or private tool output.
          required: true
        - label: I searched existing issues for this exact final error.
          required: true
