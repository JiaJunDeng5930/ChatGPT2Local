name: Checked desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - name: Version agrees with tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME}" = "v$(bun -p 'require("./package.json").version')"
      - run: bun run bend:setup
      - run: bun run verify
      - name: Build the platform package from freshly checked sources
        run: bun run app:package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Smoke the packaged desktop
        run: bun run app:smoke
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-macos-desktop
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            dist/runtime/*manifest.json
            .build/*verification.json
          include-hidden-files: true
          if-no-files-found: error
