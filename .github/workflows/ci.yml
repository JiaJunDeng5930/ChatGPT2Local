name: Fresh Bend and runtime verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: desktop
      - run: bun run bend:setup
      - name: Linux GUI prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0 libnotify4
      - name: Fresh gate on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a bun run verify
      - name: Fresh gate on macOS
        if: runner.os == 'macOS'
        run: bun run verify
      - name: Build unpacked desktop
        run: bun run app:package:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Smoke packaged desktop on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a bun run app:smoke
      - name: Smoke packaged desktop on macOS
        if: runner.os == 'macOS'
        run: bun run app:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: |
            .build/*manifest.json
            .build/*verification.json
            .build/evidence/
          include-hidden-files: true
          if-no-files-found: warn
